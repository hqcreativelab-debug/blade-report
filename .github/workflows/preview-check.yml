name: Preview smoke checks
on:
  push:
    branches: [main, feature/operational-foundation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check features.js
          node --check tests/smoke.cjs
      - name: Browser-data workflow smoke test
        run: node tests/smoke.cjs

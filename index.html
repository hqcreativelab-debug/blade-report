<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blade Report — Product Concept</title><style>
:root{--bg:#f5f7f8;--panel:#fff;--ink:#14212b;--muted:#7b8993;--line:#e5e9ec;--nav:#11232c;--accent:#26a88c;--soft:#e7f7f1;--amber:#e5a33b;--red:#db675b;--blue:#508bb8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,select,input{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:246px;min-width:246px;background:var(--nav);color:#c8d4d9;padding:24px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:9px;font-weight:850;color:#fff;font-size:20px;letter-spacing:-.7px;padding:2px 10px 26px}.logo{height:31px;width:31px;border:2px solid #59d3b0;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#75e6c5;font-size:20px}.tag{font-size:10px;color:#74a79e;margin:18px 10px 8px;text-transform:uppercase;letter-spacing:2px;font-weight:700}.nav{width:100%;display:flex;gap:12px;align-items:center;border:0;background:transparent;color:#b5c4c9;text-align:left;padding:10px 12px;border-radius:9px;margin:2px 0}.nav:hover{background:#203744;color:white}.nav.active{background:#295348;color:#bdf6df}.nav b{font-weight:500}.nav .ico{width:18px;text-align:center;font-size:17px}.side-foot{margin-top:auto;padding:14px 10px;border-top:1px solid #31434b;font-size:12px;color:#9bafba}.main{min-width:0;flex:1}.top{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 35px;gap:15px}.crumb{font-size:12px;color:var(--muted)}.topright{display:flex;gap:14px;align-items:center}.pill{background:#eaf8f2;color:#248267;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:700}.avatar{width:33px;height:33px;border-radius:50%;background:#173f49;color:white;display:grid;place-items:center;font-weight:800}.content{max-width:1400px;padding:32px 36px 70px;margin:auto}.intro{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:25px}.intro h1{font-size:30px;letter-spacing:-1.3px;margin:0 0 7px}.sub{color:var(--muted);margin:0;line-height:1.65}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;color:var(--ink);font-weight:650}.btn.primary{background:#168b72;color:white;border-color:#168b72}.btn:hover{filter:brightness(.96)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:17px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:21px;box-shadow:0 5px 21px #253e4605}.metric .num{font-size:30px;font-weight:760;letter-spacing:-1.4px;margin:12px 0 7px}.muted{color:var(--muted)}.small{font-size:12px}.micro{font-size:11px}.kicker{color:var(--muted);font-size:12px;font-weight:650}.delta{font-size:11px;color:#199c78}.row{display:flex;gap:17px}.row>*{min-width:0}.grow{flex:1}.rightcol{width:340px}.card h3{margin:0 0 16px;font-size:16px;letter-spacing:-.3px}.progress{height:7px;border-radius:7px;background:#edf1f1;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent);border-radius:7px}.line{border-bottom:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.line:last-child{border:0}.label{font-size:12px;color:#687884}.status{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:700;background:#e6f7ee;color:#188164;white-space:nowrap}.status.orange{background:#fff3df;color:#ad761f}.status.red{background:#ffebe7;color:#b8483f}.status.blue{background:#eaf4ff;color:#3275a4}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h3{margin:0}.two{display:grid;grid-template-columns:1.65fr 1fr;gap:16px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;text-align:left;min-width:560px}.table th{color:#8998a2;font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:700;padding:13px 12px;border-bottom:1px solid var(--line)}.table td{padding:16px 12px;border-bottom:1px solid var(--line);font-size:12px}.table tr:last-child td{border:0}.table tr:hover td{background:#fbfcfc}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters select,.filters input,select,input[type=text],input[type=date],textarea{border:1px solid var(--line);border-radius:8px;background:white;padding:10px 11px;outline-color:var(--accent);max-width:100%}.filters select{min-width:150px}.note{background:#ecf8f3;border:1px solid #cbece0;padding:14px;border-radius:11px;color:#36665d;line-height:1.6}.bars{display:flex;align-items:flex-end;gap:12px;height:160px;padding:15px 10px 0;border-bottom:1px solid var(--line)}.bar{flex:1;background:#a0e0cf;border-radius:6px 6px 0 0;min-width:8px}.bar:nth-child(even){background:#208f77}.barlabels{display:flex;justify-content:space-around;color:#9aa4aa;font-size:10px;margin-top:9px}.rolebar{display:flex;align-items:center;gap:10px}.rolebar select{background:#f6f9f8;font-size:12px;border:1px solid var(--line);padding:9px;border-radius:8px}.chip{display:inline-flex;background:#f2f5f5;border:1px solid #e5eeee;border-radius:7px;padding:6px 9px;color:#63747e;font-size:11px}.listcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.listcards .card{min-height:170px;cursor:pointer}.listcards .card:hover{border-color:#99d6c1}.listcards .card .icobig{font-size:26px;margin-bottom:15px}.empty{color:#87939b;padding:45px 10px;text-align:center}.mobilebox{width:300px;margin:auto;background:#17232d;border-radius:33px;padding:10px;box-shadow:0 14px 40px #1233}.phone{min-height:480px;background:#f7f9fa;border-radius:25px;overflow:hidden;padding:25px 17px 12px}.phone h3{margin:0 0 7px}.phone .card{padding:13px;margin-top:12px}.phonefoot{border-top:1px solid var(--line);display:flex;justify-content:space-around;margin-top:28px;padding-top:13px;color:#72858d;font-size:10px}.demo-banner{background:#fff8e9;border-bottom:1px solid #f4e4bf;color:#94661d;padding:8px 35px;font-size:11px;text-align:center}.hidden{display:none!important}.toast{position:fixed;bottom:25px;right:25px;background:#17362d;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #0002;z-index:3;display:none}.toast.show{display:block}.check{display:flex;align-items:center;gap:10px;margin:13px 0}.check input{accent-color:#178f75}.tabs{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:white;color:#54656f}.tabs button.active{background:#173d36;color:white}.titem{padding:14px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px}.titem select{width:100%;margin-top:10px}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.large-number{font-size:24px;font-weight:780;letter-spacing:-1px}.kpi{display:flex;justify-content:space-between;align-items:center;gap:10px}.mobile-toggle{display:none}@media(max-width:1050px){.side{width:205px;min-width:205px}.content{padding:25px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.rightcol{width:auto}.listcards{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.mobile-toggle{display:block}.side{display:none;position:fixed;z-index:5;width:260px;box-shadow:0 0 30px #0003}.side.open{display:flex}.top{padding:0 18px;height:65px}.content{padding:20px 14px}.intro{flex-direction:column}.intro h1{font-size:25px}.stats,.three,.listcards,.compare{grid-template-columns:1fr 1fr;gap:9px}.card{padding:15px}.nav{padding:11px}.demo-banner{padding:8px 15px}.hide-sm{display:none}}@media(max-width:410px){.stats,.three,.listcards,.compare{grid-template-columns:1fr}.topright .pill{display:none}}
</style></head><body><div class="shell"><aside class="side" id="sidebar"><div class="brand"><span class="logo">≋</span>BLADE<span style="color:#59c7ad">REPORT</span></div><div class="tag">Workspace</div><div id="navmain"></div><div class="tag">Management</div><div id="navadmin"></div><div class="side-foot"><div style="font-weight:700;color:#d7ece7">● Demo workspace</div><div style="margin-top:6px">All names and figures are fictional. No live data.</div></div></aside><main class="main"><div class="demo-banner">DESIGN PREVIEW · All data is fictional · No login, database, payments, AI or third-party services</div><header class="top"><div style="display:flex;gap:12px;align-items:center"><button class="btn mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><div class="crumb">Hajsberget / Blade Report Demo</div><div style="font-weight:700;font-size:13px" id="headerlabel">Overview</div></div></div><div class="topright"><span class="pill">● Concept v0.1</span><span onclick="route('tasks')" style="cursor:pointer">♧ <b id="bellcount">3</b></span><div class="rolebar"><select id="role" onchange="roleChange()"><option>Project Manager</option><option>Technician</option><option>Team Lead</option><option>Store Manager</option><option>Company Admin</option><option>Client</option></select></div><span class="avatar">BR</span></div></header><div class="content" id="page"></div></main></div><div class="toast" id="toast"></div><script>
const pages=[['overview','◫','Overview',0],['repairs','▤','Repair reports',0],['passport','◈','Blade passport',0],['monitor','◎','Blade monitor',0],['tasks','☑','Tasks & notifications',0],['requests','▣','Materials & requests',0],['timesheets','◷','Timesheets & downtime',0],['fleet','▰','Vehicles & fleet',0],['weather','☁','Weather & environment',0],['people','♙','People & competencies',1],['performance','▥','Performance intelligence',1],['outlook','▤','Blade Outlook',1],['finance','£','Costs & finance',1],['forms','⚙','Forms & settings',1],['app','▯','Mobile app preview',1]];
let current='overview',role='Project Manager',taskStatus={};const $=id=>document.getElementById(id);
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)};
function nav(){for(let grp of [0,1])$(grp?'navadmin':'navmain').innerHTML=pages.filter(p=>p[3]===grp).map(p=>`<button class="nav ${p[0]===current?'active':''}" onclick="route('${p[0]}')"><span class="ico">${p[1]}</span><b>${p[2]}</b></button>`).join('')};function route(id){current=id;nav();$('sidebar').classList.remove('open');$('headerlabel').textContent=pages.find(p=>p[0]===id)?.[2]||id;render();window.scrollTo(0,0)};function roleChange(){role=$('role').value;notify('Preview role: '+role);render()};
const card=(content,cls='')=>`<section class="card ${cls}">${content}</section>`;const stat=(name,value,foot)=>card(`<div class="kicker">${name}</div><div class="num">${value}</div><span class="delta">${foot}</span>`,'metric');const head=(title,subtitle,buttons='')=>`<div class="intro"><div><h1>${title}</h1><p class="sub">${subtitle}</p></div><div class="actions">${buttons}</div></div>`;const button=(s,msg='This action is a design preview only')=>`<button class="btn" onclick="notify('${msg.replaceAll("'","&#39;")}')">${s}</button>`;const primary=(s,msg='This action is a design preview only')=>`<button class="btn primary" onclick="notify('${msg.replaceAll("'","&#39;")}')">${s}</button>`;const tag=(s,c='')=>`<span class="status ${c}">${s}</span>`;const tbl=(headers,rows)=>card(`<div class="tablewrap"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
const records=[['T-014 · Blade B','External laminate + core','Team Alpha',tag('In progress','blue'),'68%'],['T-009 · Blade A','Leading edge protection','Team Bravo',tag('Review due','orange'),'92%'],['T-021 · Blade C','Internal laminate repair','Team Alpha',tag('In progress','blue'),'45%'],['T-031 · Blade A','Balsa replacement','Team Charlie',tag('Completed'),'100%']];
const tasks=[['Arrange winter tyres','Fleet / Stores','High','James Store Manager'],['Supply BX661 fibreglass','Materials','Normal','Sarah Stores'],['Heat blanket inspection','Equipment','High','Maintenance'],['Approve weekly timesheets','Office','Normal','Project Manager'],['Review core replacement photographs','Quality','Normal','Team Lead']];
function overview(){return head('Good afternoon, welcome back','Everything happening across your blade repair operations, in one place.',primary('+ New report','New report flow is a mockup'))+`<div class="stats">${stat('Active repairs','12','↑ 3 this week')}${stat('Technicians on site','28','Across 4 teams')}${stat('Tasks needing attention','7','2 time-sensitive')}${stat('First-pass QC','96%','Illustrative rate')}</div><div class="two"><div>${card(`<div class="sectionhead"><h3>Active repair progress</h3><a onclick="route('repairs')" style="cursor:pointer;color:#239578;font-size:12px">All repairs →</a></div>${records.slice(0,3).map(r=>`<div class="line"><div><b>${r[0]}</b><div class="small muted">${r[1]}</div></div><div style="min-width:135px;text-align:right">${r[3]}<div style="margin-top:10px" class="progress"><span style="width:${r[4]}"></span></div></div></div>`).join('')}`)}<div style="height:16px"></div>${card(`<div class="sectionhead"><h3>Work activity · this week</h3>${tag('Illustrative','blue')}</div><div class="bars">${[42,58,72,55,82,65,37,76,93,67].map(n=>`<div class="bar" style="height:${n}%"></div>`).join('')}</div><div class="barlabels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>`)}</div><div>${card(`<h3>Needs attention</h3>${[['Winter tyres requested','Fleet','orange'],['Repair report awaiting QC','Quality','blue'],['Materials delivery delayed','Stores','red']].map(t=>`<div class="line"><div><b>${t[0]}</b><div class="small muted">${t[1]}</div></div>${tag('Review',t[2])}</div>`).join('')}<button class="btn" style="width:100%;margin-top:14px" onclick="route('tasks')">View task centre →</button>`)}<div style="height:16px"></div>${card(`<h3>Site weather</h3><div class="kpi"><span style="font-size:34px">☁ 6°C</span><span class="muted small">Forecast · sample only</span></div><div class="line"><span>Wind / gust</span><b>8 / 12 m/s</b></div><div class="line"><span>Humidity</span><b>78%</b></div><div class="line"><span>Rain chance</span><b>35%</b></div><button class="btn" style="width:100%;margin-top:14px" onclick="route('weather')">Environmental records →</button>`)}</div></div>`}
function repairs(){return head('Repair reports','Customisable stage-by-stage reporting with measurements, photographs and evidence.',primary('+ Create repair'))+`<div class="filters"><select><option>All sites</option><option>Hajsberget</option><option>Site North</option></select><select><option>All statuses</option><option>In progress</option><option>Completed</option></select><select><option>All blade models</option><option>SGRE D3</option><option>SGRE 5.X</option></select></div>${tbl(['Repair','Procedure','Assigned team','Status','Progress'],records)}<div style="height:16px"></div><div class="three">${[['Damage assessment','Record extent, location, photographs'],['Grinding & preparation','Record taper, dimensions, equipment'],['Core / lamination','Add repeatable ply and core stages'],['Curing & conditions','Store ambient, surface and dew point'],['Coating & finish','Photographs and product specification'],['Quality & sign-off','Review, audit trail and export']].map((x,i)=>card(`<div class="icobig" style="font-size:24px;color:#168b72">0${i+1}</div><h3>${x[0]}</h3><p class="sub">${x[1]}</p>`)).join('')}</div>`}
function passport(){return head('Blade passport','The complete history of every blade, repair and inspection.',primary('+ Add blade'))+`<div class="filters"><input placeholder="Search blade serial number or turbine"/><select><option>All manufacturers</option><option>SGRE</option><option>Vestas</option></select><select><option>All countries</option><option>Sweden</option><option>UK</option></select></div>${tbl(['Turbine / blade','Model','Position','Repair history','Last record'],[['T-014 · BR-00072','SGRE D3','Blade B','4 repairs','14 Oct 2026'],['T-009 · BR-00051','SGRE D3','Blade A','2 repairs','12 Oct 2026'],['T-021 · BR-00218','SGRE 5.X','Blade C','6 repairs','13 Oct 2026']])}<div style="height:16px"></div>${card(`<h3>Blade BR-00072 · History timeline</h3>${[['Oct 2026','External laminate + balsa replacement'],['Aug 2026','Progressive monitoring inspection'],['Jun 2025','Leading-edge coating repair']].map(x=>`<div class="line"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}`)}`}
function monitor(){return head('Blade monitor','Progressive monitoring visits, defect photographs and comparison timelines.',primary('+ New monitoring visit'))+`<div class="stats">${stat('Monitored defects','34','7 need follow-up')}${stat('Visits this month','18','Across 6 sites')}${stat('Engineering review','3','Require assessment')}${stat('Overdue visits','2','Needs scheduling')}</div>${tbl(['Blade','Defect','Previous visit','Next visit','Outcome'],[['T-014 · Blade B','LE erosion','02 Sep 2026','20 Oct 2026',tag('Monitor','orange')],['T-019 · Blade C','Coating damage','17 Sep 2026','25 Oct 2026',tag('Unchanged')],['T-031 · Blade A','Laminate marking','15 Aug 2026','22 Oct 2026',tag('Review needed','red')]])}`}
function tasksPage(){return head('Tasks & notifications','Only the actions that need your attention; everything else stays organised.',primary('+ New task','Task creation would open here'))+`<div class="stats">${stat('My actionable tasks','5','2 high priority')}${stat('Waiting on others','8','Quietly monitored')}${stat('Completed this week','23','No additional action')}${stat('Overdue items','2','Escalation enabled')}</div><div class="two"><div>${card(`<h3>My tasks</h3>${tasks.map((t,i)=>`<div class="titem"><div class="kpi"><b>${t[0]}</b>${i===0||i===2?tag('High','orange'):tag('Normal')}</div><div class="small muted" style="margin-top:6px">${t[1]} · ${t[3]}</div><select aria-label="Task status" onchange="taskStatus[${i}]=this.value;notify('Demo task moved to '+this.value)"><option>${taskStatus[i]||'New'}</option>${['In progress','Waiting on others','Blocked','Completed'].filter(x=>x!==(taskStatus[i]||'New')).map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('')}`)}</div><div>${card(`<h3>AI workload balancing</h3><p class="sub">Suggested reassignment based on role, same-office availability and due dates.</p><div class="line"><span>James · Stores</span><b>14 tasks</b></div><div class="line"><span>Sarah · Stores</span><b>3 tasks</b></div><div class="note" style="margin-top:15px">Suggestion: move 3 routine procurement follow-ups to Sarah, subject to manager approval.</div><button class="btn" style="margin-top:14px;width:100%" onclick="notify('AI recommendation is illustrative; no tasks reassigned')">Review suggested reassignment</button>`)}</div></div>`}
function requests(){return head('Materials & requests','Manage material orders, inventory, consumables and equipment requirements.',primary('+ New request'))+`<div class="stats">${stat('Requests open','18','Across active projects')}${stat('Awaiting delivery','6','3 expected this week')}${stat('Materials catalogued','312','Approved and draft')}${stat('Flagged shortages','3','Requires action')}</div>${tbl(['Request','Project','Requested by','Owner','Status'],[['BX661 fibreglass · 10 m²','Hajsberget','Team Alpha','Store Manager',tag('Ordering','blue')],['Winter tyres · BR-VAN-014','Hajsberget','Alex Morgan','Stores Assistant',tag('Action needed','orange')],['Ampreg 31 resin · 15 kg','Site North','Team Bravo','Procurement',tag('Delivered')],['Heat blanket','Hajsberget','Team Alpha','Maintenance',tag('Blocked','red')]])}<div style="height:16px"></div>${card(`<h3>Materials catalogue</h3><div class="three">${[['Reinforcements','Biax · Triax · UD · CSM'],['Core materials','Balsa · PET · PVC'],['Resin & coatings','Manufacturer and batch tracking']].map(x=>`<div><h3>${x[0]}</h3><p class="sub">${x[1]}</p></div>`).join('')}</div>`)}`}
function timesheets(){return head('Timesheets & downtime','Track team labour, working days, standby and operational interruptions.',primary('+ Log downtime'))+`<div class="stats">${stat('Labour this week','1,128h','Illustrative')}${stat('Direct repair work','74%','Share of recorded labour')}${stat('Downtime events','16','Weather, access & equipment')}${stat('Unapproved timesheets','7','Awaiting Team Lead review')}</div><div class="two"><div>${card(`<h3>Operational downtime</h3>${[['Weather · high wind','14 Oct','3h 20m',tag('Ended')],['Platform power outage','13 Oct','2h 00m',tag('Ended')],['Waiting for other team','13 Oct','1h 10m',tag('Ended')],['Equipment inspection','12 Oct','45m',tag('Ended')]].map(x=>`<div class="line"><div><b>${x[0]}</b><div class="small muted">${x[1]}</div></div><div style="text-align:right"><b>${x[2]}</b><br>${x[3]}</div></div>`).join('')}`)}</div><div>${card(`<h3>Labour allocation</h3><div class="bars">${[55,76,64,87,75,66,82].map(n=>`<div class="bar" style="height:${n}%"></div>`).join('')}</div><div class="barlabels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div><div class="note" style="margin-top:16px">Actual site downtime and affected person-hours are stored separately to avoid double-counting.</div>`)}</div></div>`}
function fleet(){return head('Vehicles & fleet','Daily vehicle checks, winter tyres, defect reporting and maintenance tracking.',primary('+ Report defect'))+`<div class="stats">${stat('Assigned vehicles','18','Across 3 projects')}${stat('Checks completed today','14','4 awaiting submission')}${stat('Open defects','3','1 may affect availability')}${stat('Seasonal review due','5','Winter tyre checks')}</div>${tbl(['Vehicle','Location','Daily check','Seasonal compliance','Status'],[['BR-VAN-014','Hajsberget',tag('Completed'),tag('Review due','orange'),tag('Available')],['BR-VAN-021','Site North',tag('Pending','orange'),tag('Winter ready'),tag('Available')],['BR-VAN-007','Hajsberget',tag('Defect','red'),tag('Not verified','orange'),tag('Manager review','red')]])}<div style="height:16px"></div>${card(`<h3>Example daily vehicle check</h3><div class="three">${['Lights, indicators, brakes','Tyres & seasonal suitability','Warning lights & safety kit'].map(x=>`<label class="check"><input type="checkbox">${x}</label>`).join('')}</div><p class="small muted">In production, checks record pass/fail/not applicable with photographic evidence and authorised follow-up.</p>`)}`}
function weather(){return head('Weather & environment','Measured working conditions, site forecasts and evidence for repair procedures.',primary('+ Add measurement'))+`<div class="stats">${stat('Ambient temperature','6.2°C','Sample measurement')}${stat('Surface temperature','8.5°C','Sample measurement')}${stat('Relative humidity','78%','Sample measurement')}${stat('Wind','8.2 m/s','Sample measurement')}</div><div class="two"><div>${card(`<h3>Environmental log</h3>${tbl(['Time','Ambient','Surface','Humidity','Dew point margin'],[['08:30','5.8°C','7.9°C','80%','2.1°C'],['10:00','6.2°C','8.5°C','78%','2.8°C'],['11:30','6.5°C','9.0°C','75%','3.1°C']])}`)}</div><div>${card(`<h3>Local forecast</h3><p class="sub">Small convenience forecast for planning. Never replaces measured site evidence or approved technical/safety requirements.</p><div style="margin:15px 0;font-size:35px">☁ 6°C</div><div class="line"><span>Gusts</span><b>12 m/s</b></div><div class="line"><span>Rain probability</span><b>35%</b></div><div class="line"><span>Provider</span><b>Demo data</b></div>`)}</div></div>`}
function people(){return head('People & competencies','Technician profiles, competency status, expiries and role-based work history.',primary('+ Invite employee'))+`<div class="stats">${stat('Personnel','86','Across active organisations')}${stat('Competencies valid','242','Verified records')}${stat('Expiring in 6 months','17','Reminders planned')}${stat('Expired','4','Requires review')}</div>${tbl(['Employee','Role','Primary site','Competencies','Status'],[['Alex Morgan','Technician','Hajsberget','GWO Blade Repair · IRATA 2',tag('Valid')],['Emma Clarke','Team Lead','Hajsberget','GWO · IRATA 3',tag('Valid')],['Sarah Jensen','Stores','Hajsberget','Vehicle / materials training',tag('Expiring','orange')],['Daniel Berg','Technician','Site North','GWO Blade Repair',tag('Expired','red')]])}`}
function performance(){return head('Performance intelligence','Compare repairs and teams fairly, accounting for materials, complexity and downtime.',button('↓ Export report'))+`<div class="filters"><select><option>Compare teams</option><option>Compare technicians</option><option>Compare sites</option><option>Compare repairs</option></select><select><option>All competencies</option><option>GWO Blade Repair</option><option>IRATA Level 3</option></select><select><option>All sites</option><option>Hajsberget</option></select><select><option>All repair types</option><option>Laminate</option><option>Core replacement</option></select><select><option>Last 30 days</option><option>Last 90 days</option><option>Custom dates</option></select></div><div class="stats">${stat('First-pass QC','96%','Illustrative')}${stat('Direct work utilisation','73%','Illustrative')}${stat('Completed repairs','47','Selected timeframe')}${stat('Recorded downtime','53h','Selected timeframe')}</div><div class="two"><div>${card(`<h3>Comparable team outcomes</h3><div class="bars">${[73,85,69,81,77].map(n=>`<div class="bar" style="height:${n}%"></div>`).join('')}</div><div class="barlabels"><span>Alpha</span><span>Bravo</span><span>Charlie</span><span>Delta</span><span>Echo</span></div><div class="note" style="margin-top:18px">Results are illustrative, not employment suitability rankings. Any individual employment decision requires appropriately reviewed evidence and human judgement.</div>`)}</div><div>${card(`<h3>AI repair benchmarking concept</h3><div class="compare"><div><div class="kicker">Repair A</div><div class="large-number">42h</div><div class="small muted">14 m² fabric · 8 plies</div></div><div><div class="kicker">Repair B</div><div class="large-number">72h</div><div class="small muted">38 m² fabric · 14 plies</div></div></div><div class="line"><span>Repair B footprint</span><b>78% larger</b></div><div class="line"><span>Core replacement</span><b>1.1 m² vs 0.4 m²</b></div><div class="line"><span>Recorded standby</span><b>12h vs 6h</b></div><p class="sub" style="margin-top:15px">AI would explain likely contributing factors and flag insufficient evidence, not simply label the slower job inefficient.</p>`)}</div></div>`}
function outlook(){return head('Blade Outlook','Turn live project records into clear, reviewable client-facing progress reports.',primary('Generate draft','No AI service connected in this visual demo'))+`<div class="filters"><select id="aud"><option>Client-friendly summary</option><option>Management detail</option><option>Technical report</option></select><select id="per"><option>Weekly</option><option>Daily</option><option>Monthly</option><option>Custom range</option></select><select><option>Hajsberget</option><option>All projects</option><option>Site North</option></select>${button('Save reporting preset')}</div><div class="two"><div>${card(`<div class="kicker">DRAFT · REQUIRES APPROVAL</div><h2 style="margin-bottom:2px">Weekly Project Outlook</h2><p class="small muted">Hajsberget · Sample period 12–18 October 2026</p><div class="three" style="margin:19px 0">${[['68%','Work progress'],['14h','Downtime'],['3','Active repairs']].map(x=>`<div class="card" style="background:#f7f9f8;padding:12px"><div class="large-number">${x[0]}</div><div class="micro muted">${x[1]}</div></div>`).join('')}</div><h3>Progress summary</h3><p class="sub">Preparation and core replacement stages have progressed across the assigned turbines. Adverse conditions and equipment access have affected available working hours.</p><h3 style="margin-top:18px">Risks and next steps</h3><p class="sub">Outstanding material requests require confirmation before the next planned lamination stages. Completion dates remain subject to approved weather and site conditions.</p><h3 style="margin-top:18px">Project manager notes</h3><textarea style="width:100%;min-height:75px;border:1px solid var(--line);border-radius:8px;padding:12px" placeholder="Add context for the client..."></textarea><div class="actions" style="margin-top:13px">${button('Preview PDF')}${primary('Approve draft','Approval is disabled in visual demo')}</div>`)}</div><div>${card(`<h3>Included sections</h3>${['Completed work','Weather and operational delays','Next steps and outlook','Quality and inspection','Materials and deliveries','Team hours','Project costs'].map((x,i)=>`<label class="check"><input type="checkbox" ${i<3?'checked':''}> ${x}</label>`).join('')}<div class="note">Use a simple, standard or technical preset. Source-backed AI summaries would be editable and require approval.</div>`)}</div></div>`}
function finance(){return head('Costs & finance','Materials, labour, procurement, currency and commercial reporting.',button('Export cost statement'))+`<div class="stats">${stat('Materials tracked','£18,460','Sample project costs')}${stat('Labour recorded','£31,820','Illustrative valuation')}${stat('Pending purchase orders','£4,250','Estimated')}${stat('Jobs costed','24','Selected period')}</div>${tbl(['Job','Material cost','Labour cost','Other cost','Total'],[['T-014 · Blade B','£1,650','£3,420','£280','£5,350'],['T-009 · Blade A','£420','£1,280','£130','£1,830'],['T-021 · Blade C','£2,140','£4,160','£480','£6,780']])}<div style="height:16px"></div><div class="note">Sensitive cost and margin figures should be restricted to authorised finance and office roles. All amounts here are fictional.</div>`}
function forms(){return head('Forms & settings','Configure company reports, custom stages, roles, approvals and notifications.',primary('+ Create template'))+`<div class="listcards">${[['▤','External lamination','Damage → prep → laminate → curing → QC'],['▣','Internal lamination + core','Core removal → replacement → reinforcement'],['◎','Progressive blade monitoring','Baseline → visits → trend and outcome'],['☑','Daily vehicle check','Seasonal tyres → inspection → defects'],['◷','Team downtime log','Cause → start/end → affected people'],['♙','Competency records','Verify → expiry → reminders']].map(x=>card(`<div class="icobig">${x[0]}</div><h3>${x[1]}</h3><p class="sub">${x[2]}</p><div style="margin-top:12px">${tag('Template')}</div>`)).join('')}</div>`}
function app(){return head('Mobile technician preview','A deliberately simple field experience, with advanced management complexity hidden away.')+`<div class="three"><div class="mobilebox"><div class="phone"><div class="small muted">Thursday, 15 October</div><h3 style="margin-top:8px;font-size:23px">Good afternoon, Alex</h3><p class="small muted">You have 2 actions today.</p>${card(`<div class="kicker">YOUR CURRENT REPAIR</div><h3 style="margin-top:12px">T-014 · Blade B</h3><p class="sub">External lamination + core replacement</p><div class="progress" style="margin:13px 0"><span style="width:68%"></span></div><div class="small muted">68% complete</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="notify('Mobile repair reporting concept')">Continue repair →</button>`)}${card(`<div class="kicker">NEEDS ATTENTION</div><div class="line"><span>Confirm materials received</span><b>›</b></div><div class="line"><span>Complete end-of-shift</span><b>›</b></div>`)}<button class="btn" style="width:100%;margin-top:12px" onclick="notify('Quick action menu concept')">＋ Quick action</button><div class="phonefoot"><span>⌂<br>Home</span><span>▤<br>Repairs</span><span>☑<br>Tasks</span><span>◷<br>Time</span><span>♙<br>Profile</span></div></div></div><div style="grid-column:span 2">${card(`<h3>Design principles</h3><p class="sub">Field technicians should only see what is needed for the current shift. Common tasks should take very few taps, and existing information should be pre-filled.</p>${[['Offline-first','Queue evidence and measurements when connectivity is poor'],['One-tap actions','Request materials, record downtime and report a defect'],['Calm task lists','Show actionable work first; quietly group waiting tasks'],['Clear sync state','Always distinguish saved-on-device from uploaded'],['Accessible on any device','Responsive desktop, tablet and mobile patterns']].map(x=>`<div class="line"><b>${x[0]}</b><span class="small muted" style="text-align:right;max-width:57%">${x[1]}</span></div>`).join('')}`)}</div></div>`}
const renderers={overview,repairs,passport,monitor,tasks:tasksPage,requests,timesheets,fleet,weather,people,performance,outlook,finance,forms,app};function render(){$('page').innerHTML=(renderers[current]||overview)()}nav();render();
</script></body></html>
